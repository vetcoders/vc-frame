name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: 8388608

jobs:
  build:
    name: Build
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        os: [ops-linux, dragon-macos]

    runs-on: [self-hosted, '${{ matrix.os }}']

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install pinned Protoc
        uses: ./.github/actions/setup-protoc

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: wasm32-wasip1
          rustflags: ""

      - name: Build
        run: |
          cargo xtask build
          cargo build --bin vc-frame

      - name: Triage runtime process-boundary regression
        env:
          VC_FRAME_E2E_ARTIFACT_ROOT: ${{ runner.temp }}/vc-frame-triage-runtime-e2e
        run: make triage-runtime-e2e

      - name: Upload triage runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: triage-runtime-e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
          path: ${{ runner.temp }}/vc-frame-triage-runtime-e2e
          if-no-files-found: warn
          retention-days: 14

  build-windows:
    name: Build (Windows)
    timeout-minutes: 60
    runs-on: [self-hosted, windows]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install pinned Protoc
        uses: ./.github/actions/setup-protoc

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: wasm32-wasip1
          rustflags: ""

      - name: Install NASM
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1

      - name: Configure Windows tools for vendored OpenSSL
        shell: pwsh
        run: |
          $gitPerl = Join-Path $env:ProgramFiles 'Git\usr\bin'
          $perl = Join-Path $gitPerl 'perl.exe'
          if (-not (Test-Path $perl)) {
            throw "MSYS Perl is required at $perl for OpenSSL's mingw build"
          }
          $platform = & $perl -e 'print $^O'
          if ($platform -ne 'msys') {
            throw "Expected MSYS Perl, got $platform"
          }
          $strawberryLib = 'C:\Strawberry\perl\lib'
          $simpleModule = Join-Path $strawberryLib 'Locale\Maketext\Simple.pm'
          $moduleRoots = @(
            (Join-Path $strawberryLib 'ExtUtils')
            (Join-Path $strawberryLib 'Pod')
          )
          $gmake = 'C:\Strawberry\c\bin\gmake.exe'
          $requiredPaths = @($simpleModule, $gmake) + $moduleRoots
          foreach ($requiredPath in $requiredPaths) {
            if (-not (Test-Path $requiredPath)) {
              throw "Required OpenSSL build tool is missing at $requiredPath"
            }
          }
          $perlLib = Join-Path $env:RUNNER_TEMP 'vc-frame-perl-lib'
          $buildTools = Join-Path $env:RUNNER_TEMP 'vc-frame-build-tools'
          New-Item -ItemType Directory -Force -Path $buildTools | Out-Null
          $make = Join-Path $buildTools 'make.exe'
          Copy-Item -LiteralPath $gmake -Destination $make -Force
          $makeVersion = @(& $make --version)
          if ($LASTEXITCODE -ne 0 -or $makeVersion[0] -notmatch '^GNU Make ') {
            throw "GNU make preflight failed at $make"
          }
          $moduleFiles = @(Get-Item -LiteralPath $simpleModule)
          foreach ($moduleRoot in $moduleRoots) {
            $moduleFiles += @(
              Get-ChildItem -LiteralPath $moduleRoot -Recurse -File -Filter '*.pm'
            )
          }
          foreach ($moduleFile in $moduleFiles) {
            $relativePath = $moduleFile.FullName.Substring($strawberryLib.Length + 1)
            $destination = Join-Path $perlLib $relativePath
            New-Item -ItemType Directory -Force -Path (Split-Path $destination -Parent) |
              Out-Null
            Copy-Item -LiteralPath $moduleFile.FullName -Destination $destination -Force
          }
          $cygpath = Join-Path $gitPerl 'cygpath.exe'
          $msysPerlLib = & $cygpath -u $perlLib
          if ($LASTEXITCODE -ne 0 -or -not $msysPerlLib) {
            throw "Could not translate $perlLib for MSYS Perl"
          }
          $env:PERL5OPT = "-I$msysPerlLib"
          & $perl -MLocale::Maketext::Simple -MIPC::Cmd -MPod::Usage `
            -MExtUtils::MakeMaker -e 'print qq(modules=ok\n)'
          if ($LASTEXITCODE -ne 0) {
            throw "MSYS Perl cannot load the OpenSSL configure modules"
          }
          $gitPerl | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $buildTools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "OPENSSL_SRC_PERL=$perl" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PERL5OPT=-I$msysPerlLib" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build
        run: cargo xtask build

  test:
    name: Test
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        os: [ops-linux, dragon-macos]

    runs-on: [self-hosted, '${{ matrix.os }}']

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install pinned Protoc
        uses: ./.github/actions/setup-protoc

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: wasm32-wasip1
          rustflags: ""

      - name: Workflow contract
        run: ./scripts/workflow-contract.sh

      # Canonical repo-native gate: precheck (fmt, plugins, clippy, check)
      # + full test suite. Same command, same meaning, locally and here.
      - name: CI gate (make ci)
        run: make ci

  test-windows:
    name: Test (Windows)
    timeout-minutes: 60
    runs-on: [self-hosted, windows]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install pinned Protoc
        uses: ./.github/actions/setup-protoc

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rustflags: ""

      - name: Test zellij-utils
        run: cargo test --no-default-features -p zellij-utils --lib

      - name: Test zellij-server
        run: cargo test --no-default-features -p zellij-server --lib

      - name: Test zellij-client
        run: cargo test --no-default-features -p zellij-client --lib

  test-no-web:
    name: Test (No Web)
    timeout-minutes: 90
    runs-on: [self-hosted, ops-linux]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install pinned Protoc
        uses: ./.github/actions/setup-protoc

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: wasm32-wasip1
          rustflags: ""

      - name: Test without web support
        run: cargo xtask test --no-web

  format:
    name: Check Formatting
    timeout-minutes: 15
    runs-on: [self-hosted, ops-linux]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rustflags: ""

      - name: Check Format
        run: cargo xtask format --check
