name: Release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: verify-release-contract
    runs-on: [self-hosted, ops-linux]
    environment: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # Provenance comes first: everything downstream claims to describe an
      # exact commit, so refuse to start if the checkout does not match HEAD.
      - name: Verify build provenance is clean
        run: ./scripts/release-provenance.zsh guard

      - name: Verify installer fails closed
        run: sh tools/install_test.sh

      - name: Run release quality gates
        run: |
          make semgrep
          make version-check
          make release-contract-test
          make plugins-parity
          make ci
          cargo build --bin vc-frame
          make triage-runtime-e2e

      # Keep repository code outside the only step that receives the private
      # signing subkey. The step below performs data-only checks and a canary.
      - name: Verify version and signing inputs
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          installer_version="$(sed -n 's/^VERSION="${VCFRAME_VERSION:-\([^}]*\)}"/\1/p' tools/install.sh)"
          expected_fingerprint="$(
            sed -n 's/^DEFAULT_GPG_FINGERPRINT="\([A-Fa-f0-9]*\)"/\1/p' \
              tools/install.sh | tr '[:lower:]' '[:upper:]'
          )"
          test -n "$version"
          test "$installer_version" = "$version" || {
            echo "installer version $installer_version does not match Cargo version $version" >&2
            exit 1
          }
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "${GITHUB_REF#refs/tags/v}" = "$version" || {
              echo "tag ${GITHUB_REF#refs/tags/} does not match Cargo version $version" >&2
              exit 1
            }
          fi
          test -n "${GPG_PRIVATE_KEY:-}" || {
            echo "GPG_PRIVATE_KEY secret is required for release candidates and tags" >&2
            exit 1
          }
          test -n "${GPG_PUBLIC_KEY:-}" || {
            echo "GPG_PUBLIC_KEY secret is required for release candidates and tags" >&2
            exit 1
          }
          test -n "$expected_fingerprint" || {
            echo "tools/install.sh must pin DEFAULT_GPG_FINGERPRINT before release" >&2
            exit 1
          }
          key_file="$RUNNER_TEMP/vc-frame-release-key.asc"
          printf '%s\n' "$GPG_PUBLIC_KEY" > "$key_file"
          actual_primary_fingerprints="$(
            gpg --batch --with-colons --import-options show-only \
              --import "$key_file" 2>/dev/null |
              awk -F: '
                $1 == "pub" { want_primary_fingerprint = 1; next }
                want_primary_fingerprint && $1 == "fpr" {
                  print toupper($10)
                  want_primary_fingerprint = 0
                }
              '
          )"
          rm -f "$key_file"
          test "$actual_primary_fingerprints" = "$expected_fingerprint" || {
            echo "GPG_PUBLIC_KEY must contain exactly the pinned primary trust root" >&2
            exit 1
          }
          signing_home="$(mktemp -d)"
          verify_home="$(mktemp -d)"
          chmod 700 "$signing_home" "$verify_home"
          trap 'rm -rf "$signing_home" "$verify_home"' EXIT
          printf '%s\n' "$GPG_PRIVATE_KEY" |
            gpg --homedir "$signing_home" --batch --import
          printf '%s\n' "$GPG_PUBLIC_KEY" |
            gpg --homedir "$verify_home" --batch --import
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="${GITHUB_REF#refs/tags/}"
            test "$(git cat-file -t "refs/tags/$tag")" = tag || {
              echo "release ref $tag is not an annotated tag" >&2
              exit 1
            }
            test "$(git rev-list -n 1 "refs/tags/$tag")" = "$GITHUB_SHA" || {
              echo "release tag $tag does not resolve to GITHUB_SHA" >&2
              exit 1
            }
            git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
              echo "release tag $tag does not point to a commit on origin/main" >&2
              exit 1
            }
            tag_verification="$(
              GNUPGHOME="$verify_home" \
                git verify-tag --raw "refs/tags/$tag" 2>&1
            )" || {
              printf '%s\n' "$tag_verification" >&2
              echo "release tag $tag has no valid Vetcoders signature" >&2
              exit 1
            }
            tag_primary_fingerprints="$(
              printf '%s\n' "$tag_verification" |
                awk '$1 == "[GNUPG:]" && $2 == "VALIDSIG" { print toupper($NF) }'
            )"
            test "$tag_primary_fingerprints" = "$expected_fingerprint" || {
              echo "release tag must have exactly one pinned Vetcoders signer" >&2
              exit 1
            }
          fi
          printf '%s:%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/signing-canary"
          gpg_args=(--homedir "$signing_home" --batch --yes --pinentry-mode loopback)
          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            gpg_args+=(--passphrase "$GPG_PASSPHRASE")
          fi
          gpg "${gpg_args[@]}" --local-user "$expected_fingerprint" \
            --detach-sign \
            --output "$RUNNER_TEMP/signing-canary.sig" \
            "$RUNNER_TEMP/signing-canary"
          canary_verification="$(
            gpg --homedir "$verify_home" --batch --status-fd 1 \
              --verify "$RUNNER_TEMP/signing-canary.sig" \
                "$RUNNER_TEMP/signing-canary"
          )" || {
            echo "signing canary verification failed" >&2
            exit 1
          }
          canary_primary_fingerprints="$(
            printf '%s\n' "$canary_verification" |
              awk '$1 == "[GNUPG:]" && $2 == "VALIDSIG" { print toupper($NF) }'
          )"
          test "$canary_primary_fingerprints" = "$expected_fingerprint" || {
            echo "signing canary must have exactly one pinned signer" >&2
            exit 1
          }

  create-release:
    needs: verify-release
    runs-on: [self-hosted, ops-linux]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Create or refresh draft release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="candidate-${GITHUB_RUN_ID}"
            name="vc-frame candidate ${GITHUB_RUN_ID}"
          else
            tag="${GITHUB_REF#refs/tags/}"
            name="vc-frame $tag"
          fi
          python3 tools/release_sync.py notes --output "$RUNNER_TEMP/release-notes.md"
          body="$(cat "$RUNNER_TEMP/release-notes.md")"
          if response="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" 2>/dev/null)"; then
            release_id="$(printf '%s' "$response" | jq -r '.id')"
            draft="$(printf '%s' "$response" | jq -r '.draft')"
            test "$draft" = true || {
              echo "release $tag already exists and is published; refusing replacement" >&2
              exit 1
            }
            while IFS= read -r asset_id; do
              test -z "$asset_id" || gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            done < <(
              gh api --paginate \
                "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
                --jq '.[].id'
            )
            response="$(gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -f tag_name="$tag" \
              -f name="$name" \
              -f target_commitish="$GITHUB_SHA" \
              -f body="$body" \
              -F draft=true \
              -F prerelease=false)"
          else
            response="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$tag" \
              -f name="$name" \
              -f target_commitish="$GITHUB_SHA" \
              -f body="$body" \
              -F draft=true \
              -F prerelease=false)"
          fi
  build-release-normal:
    needs: create-release
    name: build-release-normal
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RUST_BACKTRACE: 1
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('candidate-{0}', github.run_id) || github.ref_name }}
      # Immutable provenance from the outer layer: every matrix runner embeds
      # the same commit, regardless of local git availability or checkout depth.
      VC_FRAME_GIT_SHA: ${{ github.sha }}
      VC_FRAME_GIT_DIRTY: "0"
    strategy:
      fail-fast: false
      matrix:
        build:
          - linux musl x64
          - linux musl aarch64
          #- linux musl riscv64
          - macos x64
          - macos aarch64
          - windows x64
        include:
          - build: linux musl x64
            runner: [self-hosted, ops-linux]
            target: x86_64-unknown-linux-musl
          - build: linux musl aarch64
            runner: [self-hosted, ops-linux]
            target: aarch64-unknown-linux-musl
#          - build: linux musl riscv64
#            runner: [self-hosted, ops-linux]
#            target: riscv64gc-unknown-linux-musl
          - build: macos x64
            runner: [self-hosted, dragon-macos]
            target: x86_64-apple-darwin
          - build: macos aarch64
            runner: [self-hosted, dragon-macos]
            target: aarch64-apple-darwin
          - build: windows x64
            runner: [self-hosted, windows]
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install pinned Protoc
        uses: ./.github/actions/setup-protoc

      - name: Install musl-tools
        if: contains(matrix.runner, 'ops-linux')
        shell: bash
        run: sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: "${{ matrix.target }},wasm32-wasip1"
          cache: false
          rustflags: ""

      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1

      - name: Build release binary (cross-compiled)
        if: matrix.build != 'windows x64'
        shell: bash
        run: cargo xtask ci cross ${{ matrix.target }}

      - name: Build release binary (Windows native)
        if: matrix.build == 'windows x64'
        shell: pwsh
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo xtask ci build-release

      - name: Create artifact (Unix)
        if: runner.os != 'Windows'
        id: make-artifact-unix
        shell: bash
        run: |
          asset_name="vc-frame-${{ matrix.target }}.tar.gz"
          tar cvzf "${asset_name}" -C "target/${{ matrix.target }}/release" vc-frame
          echo "asset_name=${asset_name}" >> "$GITHUB_OUTPUT"

      - name: Create artifact (Windows)
        if: runner.os == 'Windows'
        id: make-artifact-windows
        shell: pwsh
        run: |
          $asset_name = "vc-frame-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/release/vc-frame.exe" -DestinationPath $asset_name
          echo "asset_name=$asset_name" >> $env:GITHUB_OUTPUT

      # Checksum covers the published ARCHIVE (not the raw binary), so the
      # installer can verify download integrity before it ever unpacks the tar.
      - name: Create checksum (Unix)
        if: runner.os != 'Windows'
        id: make-checksum-unix
        shell: bash
        run: |
          asset_name="${{ steps.make-artifact-unix.outputs.asset_name }}"
          checksum_name="${asset_name}.sha256"
          if [ "$RUNNER_OS" != "macOS" ]; then
            sha256sum "${asset_name}" > "${checksum_name}"
          else
            shasum -a 256 "${asset_name}" > "${checksum_name}"
          fi
          echo "checksum_name=${checksum_name}" >> "$GITHUB_OUTPUT"

      - name: Create checksum (Windows)
        if: runner.os == 'Windows'
        id: make-checksum-windows
        shell: pwsh
        run: |
          $asset_name = "${{ steps.make-artifact-windows.outputs.asset_name }}"
          $checksum_name = "$asset_name.sha256"
          $hash = (Get-FileHash $asset_name -Algorithm SHA256).Hash.ToLower()
          "$hash  $asset_name" | Out-File -Encoding ascii $checksum_name
          echo "checksum_name=$checksum_name" >> $env:GITHUB_OUTPUT

      # GPG is the release trust root. The PRIVATE key + passphrase are provided
      # by the operator/runner at release time via secrets — never embedded here.
      # Signing is mandatory for candidates and tags. Missing key material is a
      # release blocker, never a reason to publish an unsigned archive.
      - name: Sign artifact (Unix)
        id: sign-unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          test -n "${GPG_PRIVATE_KEY:-}" || {
            echo "GPG_PRIVATE_KEY secret not set" >&2
            exit 1
          }
          expected_fingerprint="$(
            sed -n 's/^DEFAULT_GPG_FINGERPRINT="\([A-Fa-f0-9]*\)"/\1/p' \
              tools/install.sh | tr '[:lower:]' '[:upper:]'
          )"
          test -n "$expected_fingerprint" || {
            echo "tools/install.sh must pin DEFAULT_GPG_FINGERPRINT before signing" >&2
            exit 1
          }
          asset_name="${{ steps.make-artifact-unix.outputs.asset_name }}"
          signing_home="$(mktemp -d)"
          chmod 700 "$signing_home"
          trap 'gpgconf --homedir "$signing_home" --kill all 2>/dev/null || true; rm -rf "$signing_home"' EXIT
          printf '%s\n' "$GPG_PRIVATE_KEY" |
            gpg --homedir "$signing_home" --batch --import
          gpg_args=(--homedir "$signing_home" --batch --yes --pinentry-mode loopback)
          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            gpg_args+=(--passphrase "$GPG_PASSPHRASE")
          fi
          gpg "${gpg_args[@]}" --local-user "$expected_fingerprint" \
            --detach-sign --output "${asset_name}.sig" "${asset_name}"
          signature_verification="$(
            gpg --homedir "$signing_home" --batch --status-fd 1 \
              --verify "${asset_name}.sig" "${asset_name}"
          )" || {
            echo "release archive signature verification failed" >&2
            exit 1
          }
          signature_primary_fingerprints="$(
            printf '%s\n' "$signature_verification" |
              awk '$1 == "[GNUPG:]" && $2 == "VALIDSIG" { print toupper($NF) }'
          )"
          test "$signature_primary_fingerprints" = "$expected_fingerprint" || {
            echo "release archive must have exactly one pinned signer" >&2
            exit 1
          }
          echo "sig_name=${asset_name}.sig" >> "$GITHUB_OUTPUT"

      - name: Attest release archive
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.make-artifact-unix.outputs.asset_name || steps.make-artifact-windows.outputs.asset_name }}

      - name: Upload release archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ env.RELEASE_TAG }}" "${{ steps.make-artifact-unix.outputs.asset_name || steps.make-artifact-windows.outputs.asset_name }}" --repo "${{ github.repository }}"

      - name: Upload checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ env.RELEASE_TAG }}" "${{ steps.make-checksum-unix.outputs.checksum_name || steps.make-checksum-windows.outputs.checksum_name }}" --repo "${{ github.repository }}"

      - name: Upload signature
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ env.RELEASE_TAG }}" "${{ steps.sign-unix.outputs.sig_name }}" --repo "${{ github.repository }}"

      # ===== Windows MSI installer =====
      - name: Install WiX v6
        if: runner.os == 'Windows'
        shell: pwsh
        run: dotnet tool install --global wix --version 6.0.2

      - name: Add WiX UI extension
        if: runner.os == 'Windows'
        shell: pwsh
        run: wix extension add WixToolset.UI.wixext/6.0.2

      - name: Build MSI installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          New-Item -ItemType Directory -Force -Path target\wix
          wix build wix\main.wxs wix\VcFrame.wxl `
            -d Version=$version `
            -arch x64 `
            -ext WixToolset.UI.wixext `
            -o target\wix\vc-frame-x86_64-pc-windows-msvc-installer.msi

      - name: Create MSI checksum
        if: runner.os == 'Windows'
        id: make-checksum-msi
        shell: pwsh
        run: |
          $checksum_name = "vc-frame-${{ matrix.target }}-installer.msi.sha256"
          $hash = (Get-FileHash "target\wix\vc-frame-${{ matrix.target }}-installer.msi" -Algorithm SHA256).Hash.ToLower()
          "$hash  vc-frame-${{ matrix.target }}-installer.msi" | Out-File -Encoding ascii $checksum_name
          echo "checksum_name=$checksum_name" >> $env:GITHUB_OUTPUT

      - name: Attest MSI installer
        if: runner.os == 'Windows'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: target\wix\vc-frame-${{ matrix.target }}-installer.msi

      - name: Upload MSI installer
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ env.RELEASE_TAG }}" "target\wix\vc-frame-${{ matrix.target }}-installer.msi" --repo "${{ github.repository }}"

      - name: Upload MSI checksum
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ env.RELEASE_TAG }}" "${{ steps.make-checksum-msi.outputs.checksum_name }}" --repo "${{ github.repository }}"

  build-release-noweb:
    needs: create-release
    name: build-release-noweb
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RUST_BACKTRACE: 1
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('candidate-{0}', github.run_id) || github.ref_name }}
      VC_FRAME_GIT_SHA: ${{ github.sha }}
      VC_FRAME_GIT_DIRTY: "0"
    strategy:
      fail-fast: false
      matrix:
        build:
          - linux musl x64
          - linux musl aarch64
          #- linux musl riscv64
          - macos x64
          - macos aarch64
          - windows x64
        include:
          - build: linux musl x64
            runner: [self-hosted, ops-linux]
            target: x86_64-unknown-linux-musl
          - build: linux musl aarch64
            runner: [self-hosted, ops-linux]
            target: aarch64-unknown-linux-musl
#          - build: linux musl riscv64
#            runner: [self-hosted, ops-linux]
#            target: riscv64gc-unknown-linux-musl
          - build: macos x64
            runner: [self-hosted, dragon-macos]
            target: x86_64-apple-darwin
          - build: macos aarch64
            runner: [self-hosted, dragon-macos]
            target: aarch64-apple-darwin
          - build: windows x64
            runner: [self-hosted, windows]
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install pinned Protoc
        uses: ./.github/actions/setup-protoc

      - name: Install musl-tools
        if: contains(matrix.runner, 'ops-linux')
        shell: bash
        run: sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: "${{ matrix.target }},wasm32-wasip1"
          cache: false
          rustflags: ""

      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1

      - name: Build release binary (cross-compiled, no-web)
        if: matrix.build != 'windows x64'
        shell: bash
        run: cargo xtask ci cross ${{ matrix.target }} --no-web

      - name: Build release binary (Windows native, no-web)
        if: matrix.build == 'windows x64'
        shell: pwsh
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo xtask ci build-release --no-web

      - name: Create artifact (Unix)
        if: runner.os != 'Windows'
        id: make-artifact-unix
        shell: bash
        run: |
          asset_name="vc-frame-no-web-${{ matrix.target }}.tar.gz"
          tar cvzf "${asset_name}" -C "target/${{ matrix.target }}/release" vc-frame
          echo "asset_name=${asset_name}" >> "$GITHUB_OUTPUT"

      - name: Create artifact (Windows)
        if: runner.os == 'Windows'
        id: make-artifact-windows
        shell: pwsh
        run: |
          $asset_name = "vc-frame-no-web-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/release/vc-frame.exe" -DestinationPath $asset_name
          echo "asset_name=$asset_name" >> $env:GITHUB_OUTPUT

      - name: Create checksum (Unix)
        if: runner.os != 'Windows'
        id: make-checksum-unix
        shell: bash
        run: |
          asset_name="${{ steps.make-artifact-unix.outputs.asset_name }}"
          checksum_name="${asset_name}.sha256"
          if [[ "$RUNNER_OS" != "macOS" ]]; then
            sha256sum "${asset_name}" > "${checksum_name}"
          else
            shasum -a 256 "${asset_name}" > "${checksum_name}"
          fi
          echo "checksum_name=${checksum_name}" >> "$GITHUB_OUTPUT"

      - name: Create checksum (Windows)
        if: runner.os == 'Windows'
        id: make-checksum-windows
        shell: pwsh
        run: |
          $asset_name = "${{ steps.make-artifact-windows.outputs.asset_name }}"
          $checksum_name = "$asset_name.sha256"
          $hash = (Get-FileHash $asset_name -Algorithm SHA256).Hash.ToLower()
          "$hash  $asset_name" | Out-File -Encoding ascii $checksum_name
          echo "checksum_name=$checksum_name" >> $env:GITHUB_OUTPUT

      - name: Sign artifact (Unix)
        id: sign-unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          test -n "${GPG_PRIVATE_KEY:-}" || {
            echo "GPG_PRIVATE_KEY secret not set" >&2
            exit 1
          }
          expected_fingerprint="$(
            sed -n 's/^DEFAULT_GPG_FINGERPRINT="\([A-Fa-f0-9]*\)"/\1/p' \
              tools/install.sh | tr '[:lower:]' '[:upper:]'
          )"
          test -n "$expected_fingerprint" || {
            echo "tools/install.sh must pin DEFAULT_GPG_FINGERPRINT before signing" >&2
            exit 1
          }
          asset_name="${{ steps.make-artifact-unix.outputs.asset_name }}"
          signing_home="$(mktemp -d)"
          chmod 700 "$signing_home"
          trap 'gpgconf --homedir "$signing_home" --kill all 2>/dev/null || true; rm -rf "$signing_home"' EXIT
          printf '%s\n' "$GPG_PRIVATE_KEY" |
            gpg --homedir "$signing_home" --batch --import
          gpg_args=(--homedir "$signing_home" --batch --yes --pinentry-mode loopback)
          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            gpg_args+=(--passphrase "$GPG_PASSPHRASE")
          fi
          gpg "${gpg_args[@]}" --local-user "$expected_fingerprint" \
            --detach-sign --output "${asset_name}.sig" "${asset_name}"
          signature_verification="$(
            gpg --homedir "$signing_home" --batch --status-fd 1 \
              --verify "${asset_name}.sig" "${asset_name}"
          )" || {
            echo "release archive signature verification failed" >&2
            exit 1
          }
          signature_primary_fingerprints="$(
            printf '%s\n' "$signature_verification" |
              awk '$1 == "[GNUPG:]" && $2 == "VALIDSIG" { print toupper($NF) }'
          )"
          test "$signature_primary_fingerprints" = "$expected_fingerprint" || {
            echo "release archive must have exactly one pinned signer" >&2
            exit 1
          }
          echo "sig_name=${asset_name}.sig" >> "$GITHUB_OUTPUT"

      - name: Attest release archive
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.make-artifact-unix.outputs.asset_name || steps.make-artifact-windows.outputs.asset_name }}

      - name: Upload release archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ env.RELEASE_TAG }}" "${{ steps.make-artifact-unix.outputs.asset_name || steps.make-artifact-windows.outputs.asset_name }}" --repo "${{ github.repository }}"

      - name: Upload checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ env.RELEASE_TAG }}" "${{ steps.make-checksum-unix.outputs.checksum_name || steps.make-checksum-windows.outputs.checksum_name }}" --repo "${{ github.repository }}"

      - name: Upload signature
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ env.RELEASE_TAG }}" "${{ steps.sign-unix.outputs.sig_name }}" --repo "${{ github.repository }}"

      # ===== Windows MSI installer (no-web) =====
      - name: Install WiX v6
        if: runner.os == 'Windows'
        shell: pwsh
        run: dotnet tool install --global wix --version 6.0.2

      - name: Add WiX UI extension
        if: runner.os == 'Windows'
        shell: pwsh
        run: wix extension add WixToolset.UI.wixext/6.0.2

      - name: Build MSI installer (no-web)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          New-Item -ItemType Directory -Force -Path target\wix
          wix build wix\main.wxs wix\VcFrame.wxl `
            -d Version=$version `
            -arch x64 `
            -ext WixToolset.UI.wixext `
            -o target\wix\vc-frame-no-web-${{ matrix.target }}-installer.msi

      - name: Create MSI checksum (no-web)
        if: runner.os == 'Windows'
        id: make-checksum-msi
        shell: pwsh
        run: |
          $checksum_name = "vc-frame-no-web-${{ matrix.target }}-installer.sha256sum"
          $hash = (Get-FileHash "target\wix\vc-frame-no-web-${{ matrix.target }}-installer.msi" -Algorithm SHA256).Hash.ToLower()
          "$hash  vc-frame-no-web-${{ matrix.target }}-installer.msi" | Out-File -Encoding ascii $checksum_name
          echo "checksum_name=$checksum_name" >> $env:GITHUB_OUTPUT

      - name: Attest MSI installer (no-web)
        if: runner.os == 'Windows'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: target\wix\vc-frame-no-web-${{ matrix.target }}-installer.msi

      - name: Upload MSI installer (no-web)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ env.RELEASE_TAG }}" "target\wix\vc-frame-no-web-${{ matrix.target }}-installer.msi" --repo "${{ github.repository }}"

      - name: Upload MSI checksum (no-web)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ env.RELEASE_TAG }}" "${{ steps.make-checksum-msi.outputs.checksum_name }}" --repo "${{ github.repository }}"

  # ===========================================================================
  # Finalize: publish the signed release manifest + the GPG public key.
  #
  # The manifest is the source of truth the canonical installer (tools/install.sh)
  # reads to resolve the per-target archive name and exact release commit. It is
  # generated deterministically from the build matrix — the installer pulls each
  # archive's SHA256 from the per-artifact `.sha256` sidecar.
  #
  # `vc-frame-signing.asc` is the PUBLIC half of the release key, published so
  # `tools/install.sh` can establish the GPG trust root. The private key never
  # appears here; it lives only in the operator-provided secrets used to sign.
  # ===========================================================================
  publish-manifest:
    needs: [create-release, build-release-normal, build-release-noweb]
    name: publish-manifest
    runs-on: [self-hosted, ops-linux]
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('candidate-{0}', github.run_id) || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Generate manifest.json
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          git_sha="$(git rev-parse HEAD)"
          test "$git_sha" = "$GITHUB_SHA" || {
            echo "manifest checkout $git_sha does not match GITHUB_SHA $GITHUB_SHA" >&2
            exit 1
          }
          case "$git_sha" in
            ""|*[!0-9a-f]*)
              echo "manifest git_sha is not hexadecimal" >&2
              exit 1
              ;;
          esac
          test "${#git_sha}" -eq 40 || {
            echo "manifest git_sha is not a full 40-character commit identity" >&2
            exit 1
          }
          targets="x86_64-apple-darwin aarch64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl"
          {
            printf '{\n'
            printf '  "product": "vc-frame",\n'
            printf '  "version": "%s",\n' "$version"
            printf '  "git_sha": "%s",\n' "$git_sha"
            printf '  "tag": "%s",\n' "$RELEASE_TAG"
            printf '  "signing_key": "vc-frame-signing.asc",\n'
            printf '  "artifacts": {\n'
            first=1
            for t in $targets; do
              [ "$first" -eq 1 ] || printf ',\n'
              first=0
              printf '    "%s": "vc-frame-%s.tar.gz"' "$t" "$t"
            done
            printf '\n  }\n'
            printf '}\n'
          } > manifest.json
          cat manifest.json

      - name: Sign manifest.json
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          test -n "${GPG_PRIVATE_KEY:-}" || {
            echo "GPG_PRIVATE_KEY secret not set" >&2
            exit 1
          }
          expected_fingerprint="$(
            sed -n 's/^DEFAULT_GPG_FINGERPRINT="\([A-Fa-f0-9]*\)"/\1/p' \
              tools/install.sh | tr '[:lower:]' '[:upper:]'
          )"
          test -n "$expected_fingerprint" || {
            echo "tools/install.sh must pin DEFAULT_GPG_FINGERPRINT before signing" >&2
            exit 1
          }
          signing_home="$(mktemp -d)"
          chmod 700 "$signing_home"
          trap 'gpgconf --homedir "$signing_home" --kill all 2>/dev/null || true; rm -rf "$signing_home"' EXIT
          printf '%s\n' "$GPG_PRIVATE_KEY" |
            gpg --homedir "$signing_home" --batch --import
          gpg_args=(--homedir "$signing_home" --batch --yes --pinentry-mode loopback)
          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            gpg_args+=(--passphrase "$GPG_PASSPHRASE")
          fi
          gpg "${gpg_args[@]}" --local-user "$expected_fingerprint" \
            --detach-sign --output manifest.json.sig manifest.json
          manifest_verification="$(
            gpg --homedir "$signing_home" --batch --status-fd 1 \
              --verify manifest.json.sig manifest.json
          )" || {
            echo "manifest signature verification failed" >&2
            exit 1
          }
          manifest_primary_fingerprints="$(
            printf '%s\n' "$manifest_verification" |
              awk '$1 == "[GNUPG:]" && $2 == "VALIDSIG" { print toupper($NF) }'
          )"
          test "$manifest_primary_fingerprints" = "$expected_fingerprint" || {
            echo "manifest must have exactly one pinned signer" >&2
            exit 1
          }

      - name: Write GPG public key
        env:
          GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
        run: |
          if [ -z "${GPG_PUBLIC_KEY:-}" ]; then
            echo "GPG_PUBLIC_KEY secret not set" >&2
            exit 1
          fi
          printf '%s\n' "$GPG_PUBLIC_KEY" > vc-frame-signing.asc

      - name: Upload signed manifest, public key, and installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ env.RELEASE_TAG }}" manifest.json manifest.json.sig vc-frame-signing.asc tools/install.sh --repo "${{ github.repository }}"

  verify-and-publish:
    needs: [build-release-normal, build-release-noweb, publish-manifest]
    name: verify-assets-and-publish
    runs-on: [self-hosted, ops-linux]
    environment: release
    permissions:
      contents: write
      attestations: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Verify the complete release asset contract
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="candidate-${GITHUB_RUN_ID}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          required="
          manifest.json
          manifest.json.sig
          vc-frame-signing.asc
          install.sh
          vc-frame-x86_64-unknown-linux-musl.tar.gz
          vc-frame-x86_64-unknown-linux-musl.tar.gz.sha256
          vc-frame-x86_64-unknown-linux-musl.tar.gz.sig
          vc-frame-aarch64-unknown-linux-musl.tar.gz
          vc-frame-aarch64-unknown-linux-musl.tar.gz.sha256
          vc-frame-aarch64-unknown-linux-musl.tar.gz.sig
          vc-frame-x86_64-apple-darwin.tar.gz
          vc-frame-x86_64-apple-darwin.tar.gz.sha256
          vc-frame-x86_64-apple-darwin.tar.gz.sig
          vc-frame-aarch64-apple-darwin.tar.gz
          vc-frame-aarch64-apple-darwin.tar.gz.sha256
          vc-frame-aarch64-apple-darwin.tar.gz.sig
          vc-frame-x86_64-pc-windows-msvc.zip
          vc-frame-x86_64-pc-windows-msvc.zip.sha256
          vc-frame-x86_64-pc-windows-msvc-installer.msi
          vc-frame-x86_64-pc-windows-msvc-installer.msi.sha256
          vc-frame-no-web-x86_64-unknown-linux-musl.tar.gz
          vc-frame-no-web-x86_64-unknown-linux-musl.tar.gz.sha256
          vc-frame-no-web-x86_64-unknown-linux-musl.tar.gz.sig
          vc-frame-no-web-aarch64-unknown-linux-musl.tar.gz
          vc-frame-no-web-aarch64-unknown-linux-musl.tar.gz.sha256
          vc-frame-no-web-aarch64-unknown-linux-musl.tar.gz.sig
          vc-frame-no-web-x86_64-apple-darwin.tar.gz
          vc-frame-no-web-x86_64-apple-darwin.tar.gz.sha256
          vc-frame-no-web-x86_64-apple-darwin.tar.gz.sig
          vc-frame-no-web-aarch64-apple-darwin.tar.gz
          vc-frame-no-web-aarch64-apple-darwin.tar.gz.sha256
          vc-frame-no-web-aarch64-apple-darwin.tar.gz.sig
          vc-frame-no-web-x86_64-pc-windows-msvc.zip
          vc-frame-no-web-x86_64-pc-windows-msvc.zip.sha256
          vc-frame-no-web-x86_64-pc-windows-msvc-installer.msi
          vc-frame-no-web-x86_64-pc-windows-msvc-installer.sha256sum
          "
          asset_contract_dir="$(mktemp -d)"
          trap 'rm -rf "$asset_contract_dir"' EXIT
          printf '%s\n' "$required" |
            awk 'NF { print $1 }' |
            LC_ALL=C sort > "$asset_contract_dir/expected"
          printf '%s\n' "$assets" |
            sed '/^[[:space:]]*$/d' |
            LC_ALL=C sort > "$asset_contract_dir/actual"
          if ! cmp -s "$asset_contract_dir/expected" "$asset_contract_dir/actual"; then
            echo "release asset set does not exactly match the canonical contract" >&2
            diff -u "$asset_contract_dir/expected" "$asset_contract_dir/actual" || true
            exit 1
          fi

      - name: Verify GitHub OIDC attestations
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="candidate-${GITHUB_RUN_ID}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          attestation_dir="$(mktemp -d)"
          trap 'rm -rf "$attestation_dir"' EXIT
          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$attestation_dir" \
            --pattern 'vc-frame-*.tar.gz' \
            --pattern 'vc-frame-*.zip' \
            --pattern 'vc-frame-*.msi'
          shopt -s nullglob
          subjects=(
            "$attestation_dir"/*.tar.gz
            "$attestation_dir"/*.zip
            "$attestation_dir"/*.msi
          )
          if [ "${#subjects[@]}" -ne 12 ]; then
            echo "expected 12 attested release subjects, found ${#subjects[@]}" >&2
            exit 1
          fi
          for subject in "${subjects[@]}"; do
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY"
          done

      - name: Verify release checksums and GPG signatures
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="candidate-${GITHUB_RUN_ID}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          test -n "${GPG_PUBLIC_KEY:-}" || {
            echo "GPG_PUBLIC_KEY secret not set" >&2
            exit 1
          }
          verification_dir="$(mktemp -d)"
          verify_home="$(mktemp -d)"
          chmod 700 "$verify_home"
          trap 'rm -rf "$verification_dir" "$verify_home"' EXIT
          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$verification_dir" \
            --pattern 'vc-frame-*.tar.gz' \
            --pattern 'vc-frame-*.zip' \
            --pattern 'vc-frame-*.msi' \
            --pattern 'vc-frame-*.sha256' \
            --pattern 'vc-frame-*.sha256sum' \
            --pattern 'vc-frame-*.sig' \
            --pattern 'manifest.json' \
            --pattern 'manifest.json.sig' \
            --pattern 'vc-frame-signing.asc' \
            --pattern 'install.sh'

          printf '%s\n' "$GPG_PUBLIC_KEY" |
            gpg --homedir "$verify_home" --batch --import
          expected_fingerprint="$(
            sed -n 's/^DEFAULT_GPG_FINGERPRINT="\([A-Fa-f0-9]*\)"/\1/p' \
              "$verification_dir/install.sh" |
              tr '[:lower:]' '[:upper:]'
          )"
          secret_primary_fingerprints="$(
            printf '%s\n' "$GPG_PUBLIC_KEY" |
              gpg --homedir "$verify_home" --batch --with-colons \
                --import-options show-only --import 2>/dev/null |
              awk -F: '
                $1 == "pub" { want_primary_fingerprint = 1; next }
                want_primary_fingerprint && $1 == "fpr" {
                  print toupper($10)
                  want_primary_fingerprint = 0
                }
              '
          )"
          published_primary_fingerprints="$(
            gpg --homedir "$verify_home" --batch --with-colons \
              --import-options show-only --import \
                "$verification_dir/vc-frame-signing.asc" 2>/dev/null |
              awk -F: '
                $1 == "pub" { want_primary_fingerprint = 1; next }
                want_primary_fingerprint && $1 == "fpr" {
                  print toupper($10)
                  want_primary_fingerprint = 0
                }
              '
          )"
          test -n "$expected_fingerprint"
          test "$secret_primary_fingerprints" = "$expected_fingerprint" || {
            echo "GPG_PUBLIC_KEY must contain exactly the pinned primary trust root" >&2
            exit 1
          }
          test "$published_primary_fingerprints" = "$expected_fingerprint" || {
            echo "published key bundle must contain exactly the pinned primary trust root" >&2
            exit 1
          }

          shopt -s nullglob
          subjects=(
            "$verification_dir"/*.tar.gz
            "$verification_dir"/*.zip
            "$verification_dir"/*.msi
          )
          checksums=(
            "$verification_dir"/*.sha256
            "$verification_dir"/*.sha256sum
          )
          signatures=("$verification_dir"/*.sig)
          test "${#subjects[@]}" -eq 12
          test "${#checksums[@]}" -eq 12
          test "${#signatures[@]}" -eq 9
          for checksum in "${checksums[@]}"; do
            (
              cd "$verification_dir"
              sha256sum --check "$(basename "$checksum")"
            )
          done
          for signature in "${signatures[@]}"; do
            subject="${signature%.sig}"
            test -f "$subject"
            signature_verification="$(
              gpg --homedir "$verify_home" --batch --status-fd 1 \
                --verify "$signature" "$subject"
            )" || {
              echo "signature verification failed for $(basename "$subject")" >&2
              exit 1
            }
            signature_primary_fingerprints="$(
              printf '%s\n' "$signature_verification" |
                awk '$1 == "[GNUPG:]" && $2 == "VALIDSIG" { print toupper($NF) }'
            )"
            test "$signature_primary_fingerprints" = "$expected_fingerprint" || {
              echo "signature must have exactly one pinned signer: $(basename "$subject")" >&2
              exit 1
            }
          done
          manifest_git_sha="$(
            sed -n 's/^[[:space:]]*"git_sha"[[:space:]]*:[[:space:]]*"\([0-9A-Fa-f]*\)".*/\1/p' \
              "$verification_dir/manifest.json" |
              tr '[:upper:]' '[:lower:]'
          )"
          test "$manifest_git_sha" = "$GITHUB_SHA" || {
            echo "signed manifest git_sha does not match GITHUB_SHA" >&2
            exit 1
          }

      - name: Cold-install exact downloaded release
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="candidate-${GITHUB_RUN_ID}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          version="$(printf '%s' "$tag" | sed -n 's/^v//p')"
          if [ -z "$version" ]; then
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          fi
          case "$(uname -m)" in
            x86_64|amd64) target=x86_64-unknown-linux-musl ;;
            aarch64|arm64) target=aarch64-unknown-linux-musl ;;
            *) echo "unsupported cold-install host architecture" >&2; exit 1 ;;
          esac
          cold_root="$(mktemp -d)"
          release_dir="$cold_root/v$version"
          install_dir="$cold_root/install"
          port_file="$cold_root/http.port"
          mkdir -p "$release_dir" "$install_dir"
          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$release_dir" \
            --pattern manifest.json \
            --pattern manifest.json.sig \
            --pattern vc-frame-signing.asc \
            --pattern install.sh \
            --pattern "vc-frame-$target.tar.gz" \
            --pattern "vc-frame-$target.tar.gz.sha256" \
            --pattern "vc-frame-$target.tar.gz.sig"
          python3 - "$cold_root" "$port_file" <<'PY' &
          import functools
          import http.server
          import pathlib
          import sys

          root, port_file = sys.argv[1:]
          handler = functools.partial(
              http.server.SimpleHTTPRequestHandler, directory=root
          )
          server = http.server.ThreadingHTTPServer(("127.0.0.1", 0), handler)
          pathlib.Path(port_file).write_text(
              str(server.server_address[1]), encoding="utf-8"
          )
          server.serve_forever()
          PY
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            rm -rf "$cold_root"
          }
          trap cleanup EXIT
          for _ in $(seq 1 100); do
            test -s "$port_file" && break
            kill -0 "$server_pid" 2>/dev/null || {
              echo "cold-install HTTP server exited" >&2
              exit 1
            }
            sleep 0.1
          done
          test -s "$port_file"
          base_url="http://127.0.0.1:$(cat "$port_file")"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            VCFRAME_VERSION="$version" \
            VCFRAME_BASE_URL="$base_url" \
            INSTALL_DIR="$install_dir" \
            VCFRAME_NO_PROFILE_UPDATE=1 \
            sh "$release_dir/install.sh"
          "$install_dir/vc-frame" --version | grep -F "$version"

      - name: Publish verified draft
        if: github.event_name == 'push'
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
