name: End to End tests

on:
  push:
    # Direct delivery only. Do not add `develop` here: the open develop→main
    # PR already re-runs on every develop push, and a second push trigger would
    # double every CI run.
    branches: [main]
  pull_request:
    # Feature branches targeting develop need the same gate as main-bound PRs.
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test-e2e:
    name: Build generic binary and run tests on it
    timeout-minutes: 90
    runs-on: ubuntu-latest
    environment: cachix

    services:
      ssh:
        image: ghcr.io/linuxserver/openssh-server
        env:
          PUID: 1001
          PGID: 1000
          TZ: Europe/Vienna
          # Password auth is off. The only credential is an ed25519 keypair
          # generated fresh in this job; its public half is handed to the image
          # through PUBLIC_KEY_FILE and picked up by the init on `docker restart`.
          # A static test/test credential on this container is what was abused
          # on 2026-07-30 (RedTail miner, see _SECURITY/incidents/2026_0730).
          PASSWORD_ACCESS: false
          USER_NAME: test
          PUBLIC_KEY_FILE: /usr/src/zellij/.ci-ssh/id_ed25519.pub
        # Keep the 127.0.0.1 prefix even on GitHub-hosted runners: docker publish
        # DNATs into the FORWARD path, which INPUT-only firewalls never filter.
        # A publicly bound SSH test service on the (since retired) self-hosted
        # runner is exactly what was abused on 2026-07-30.
        ports:
          # Loopback only — defense in depth, see above.
          - 127.0.0.1:2222:2222
        # :ro — the build tree is an input to the container, never an output.
        # The 2026-07-30 payload was written to the host through this mount.
        options: -v ${{ github.workspace }}/target:/usr/src/zellij:ro --name ssh --security-opt no-new-privileges:true
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '24'

    - name: Install pinned Protoc
      uses: ./.github/actions/setup-protoc

    - name: Install musl-tools
      run: sudo apt-get install -y --no-install-recommends musl-tools

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      with:
        target: wasm32-wasip1
        rustflags: ""

    - name: Create target folder
      run: mkdir -p ${{ github.workspace }}/target
      # we copy this manually into the target folder instead of mounting it because
      # github actions creates the service first, and if it has a mount that is part
      # of your yet unchecked out code, you cannot checkout the code after the mount

    - name: Copy fixtures folder to target
      run: cp -r ${{ github.workspace }}/src/tests/fixtures ${{ github.workspace }}/target

    - name: Generate ephemeral e2e SSH keypair
      # Private half stays in RUNNER_TEMP, which is NOT mounted into the container.
      # Public half goes into the (read-only) target mount for the image init to read.
      env:
        WORKSPACE: ${{ github.workspace }}
        KEY_COMMENT: vc-frame-e2e ${{ github.run_id }}/${{ github.run_attempt }}
      run: |
        set -euo pipefail
        priv="$RUNNER_TEMP/e2e_ssh_key"
        rm -f "$priv" "$priv.pub"
        ssh-keygen -t ed25519 -N '' -q -C "$KEY_COMMENT" -f "$priv"
        chmod 600 "$priv"
        keydir="$WORKSPACE/target/.ci-ssh"
        rm -rf "$keydir"
        mkdir -p "$keydir"
        install -m 0644 "$priv.pub" "$keydir/id_ed25519.pub"
        echo "ZELLIJ_E2E_SSH_KEY=$priv" >> "$GITHUB_ENV"

    - name: Build the e2e binary
      # Explicit build so the symlink step below has something to point at.
      # `--test` builds too, but that run is incremental and therefore cheap.
      run: cargo xtask ci e2e --build

    - name: Publish arch-stable binary path for the container
      # /usr/src/zellij/zellij is baked into the committed e2e snapshots, so this
      # path must stay exactly as is. The container used to create the symlink
      # itself (`ln -sf` in remote_runner.rs); with a :ro mount it cannot, so the
      # host does it. `uname -m` keeps this working on non-x86_64 runners.
      env:
        WORKSPACE: ${{ github.workspace }}
      run: |
        set -euo pipefail
        reldir="$(uname -m)-unknown-linux-musl/release"
        bin=""
        for cand in vc-frame zellij; do
          if [ -x "$WORKSPACE/target/$reldir/$cand" ]; then bin="$cand"; break; fi
        done
        if [ -z "$bin" ]; then
          echo "no musl release binary in target/$reldir" >&2
          ls -la "$WORKSPACE/target/$reldir" || true
          exit 1
        fi
        ln -sfn "$reldir/$bin" "$WORKSPACE/target/zellij"

    - name: Restart ssh container
      # we need to do this because otherwise the volume will not be mounted
      # on the docker container, since it was created before the folder existed.
      # The restart also re-runs the image init, which is what installs the
      # ephemeral public key into /config/.ssh/authorized_keys.
      run: docker restart ssh
    - name: Test
      # INSTA_UPDATE=always: chrome redesign (◉ tabs, LIVE/HEALTH status)
      # invalidates every committed e2e snap. Accept on this pass; the next
      # commit lands the updated snaps. Volatile LIVE/CPU/MEM/DISK/HEALTH is
      # stripped in account_for_races_in_snapshot so host load does not churn.
      env:
        INSTA_UPDATE: always
      run: cargo xtask ci e2e --test
    - name: Upload refreshed e2e snapshots
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: e2e-snapshots-${{ github.run_id }}
        path: src/tests/e2e/snapshots/
        if-no-files-found: warn
        retention-days: 7