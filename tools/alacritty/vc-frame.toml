# vc-frame host preset for Alacritty (>= 0.14, TOML config)
#
# Alacritty is the maintenance input of the Vibecrafted stack: vc-frame owns
# the chrome (rail, bars, tabs), the terminal stays a transparent host.
# Use via import so your own alacritty.toml keeps the last word:
#
#   [general]
#   import = ["~/.config/alacritty/vc-frame.toml"]
#
# Full rationale for every knob: docs/ALACRITTY_INTEGRATION.md

[general]
live_config_reload = true

[terminal]
# Land straight in the operator workspace. Comment this block out if you
# prefer a plain shell and want to start vc-frame by hand.
#
# Launch through a login zsh so the vc-frame *server* inherits SHELL and a
# full profile. Spawning `vc-frame` as the program itself left SHELL unset
# and every new pane fell back to bare /bin/sh.
shell = { program = "/bin/zsh", args = ["-lc", "exec vc-frame attach --create main"] }

[window]
# NON-NEGOTIABLE on macOS: without this, Option produces locale characters
# (ę, €, …) instead of Alt — Alt+e (Composer) and the Alt+Shift external-open
# click never reach vc-frame.
option_as_alt = "Both"
# Native-app illusion (lifted from the operator's daily config, 2026-07-29):
# the OS titlebar dissolves and the compact-bar becomes the de-facto window
# chrome — vc-frame reads as a native app instead of a program in a terminal.
title = "𝚅𝚒𝚋𝚎𝚌𝚛𝚊𝚏𝚝𝚎𝚍."
decorations = "Transparent"
startup_mode = "Maximized"
blur = true
opacity = 0.9
# The chrome paints its own background; zero padding avoids visible seams.
padding = { x = 0, y = 0 }
dynamic_padding = true

[font]
# Any complete monospace works — the chrome glyphs (◉ ○ ⚿ ⌁ │ ·) are plain
# text-presentation Unicode, not emoji and not private-use icons. A Nerd Font
# is a safe superset if you also want powerline/devicon coverage.
# normal = { family = "JetBrainsMono Nerd Font" }
size = 13.0

[mouse]
hide_when_typing = true
bindings = [
  # While vc-frame mouse reporting is active, Shift suppresses reporting so
  # the wheel can drive Alacritty's own scrollback instead.
  { mouse = "WheelUp", mods = "Shift", action = "ScrollLineUp" },
  { mouse = "WheelDown", mods = "Shift", action = "ScrollLineDown" },
]

# ─── option_as_alt survival kit ─────────────────────────────────────────────
# `option_as_alt = "Both"` takes the whole Option layer away from macOS text
# input. Locale characters typed with Option are re-injected below (Polish
# shown — the operator's daily layer; adapt or delete for your locale).
# Without these, Option+letter reaches vc-frame as Alt and the diacritic
# never appears.
#
# Word-jump is NOT host-bound: Alt+Left/Right are the product key-contract
# for tabs in unlocked modes, and LOCK-mode word-jump is done inside
# vc-frame (`Write 27 98/102` in assets/config/default.kdl). Host chars for
# Alt+arrows would steal those keys from vc-frame.
[[keyboard.bindings]]
key = "A"
mods = "Alt"
chars = "ą"

[[keyboard.bindings]]
key = "A"
mods = "Alt|Shift"
chars = "Ą"

[[keyboard.bindings]]
key = "C"
mods = "Alt"
chars = "ć"

[[keyboard.bindings]]
key = "C"
mods = "Alt|Shift"
chars = "Ć"

[[keyboard.bindings]]
key = "E"
mods = "Alt"
chars = "ę"

[[keyboard.bindings]]
key = "E"
mods = "Alt|Shift"
chars = "Ę"

[[keyboard.bindings]]
key = "L"
mods = "Alt"
chars = "ł"

[[keyboard.bindings]]
key = "L"
mods = "Alt|Shift"
chars = "Ł"

[[keyboard.bindings]]
key = "N"
mods = "Alt"
chars = "ń"

[[keyboard.bindings]]
key = "N"
mods = "Alt|Shift"
chars = "Ń"

[[keyboard.bindings]]
key = "O"
mods = "Alt"
chars = "ó"

[[keyboard.bindings]]
key = "O"
mods = "Alt|Shift"
chars = "Ó"

[[keyboard.bindings]]
key = "S"
mods = "Alt"
chars = "ś"

[[keyboard.bindings]]
key = "S"
mods = "Alt|Shift"
chars = "Ś"

[[keyboard.bindings]]
key = "X"
mods = "Alt"
chars = "ź"

[[keyboard.bindings]]
key = "X"
mods = "Alt|Shift"
chars = "Ź"

[[keyboard.bindings]]
key = "Z"
mods = "Alt"
chars = "ż"

[[keyboard.bindings]]
key = "Z"
mods = "Alt|Shift"
chars = "Ż"

# Multiline drafting: Shift+Enter inserts a newline instead of submitting
# (pairs with the Composer flow for quick inline multi-line commands).
[[keyboard.bindings]]
key = "Enter"
mods = "Shift"
chars = "\u001B\r"

# ─── Host URL / hyperlink hints ─────────────────────────────────────────────
# While mouse-reporting is active, Alacritty requires Shift to activate hints.
# That is the official host-side browser/open gesture:
#   Shift+click URL / OSC 8 hyperlink → open (macOS `open`)
# vc-frame still owns bare Click and Alt+Shift / Ctrl+Shift for paths without
# OSC 8. Keep mouse.enabled = true — without it Shift+click is a lottery of
# Alacritty defaults across versions.
[[hints.enabled]]
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+"
hyperlinks = true
post_processing = true
# macOS: `open` resolves http → browser and file:// → system app (Pensieve, etc.)
command = "open"
mouse = { enabled = true }
binding = { key = "U", mods = "Control|Shift" }

# ─── What is deliberately NOT here ──────────────────────────────────────────
# - No bare Shift+click *keyboard* bindings: terminals reserve Shift+click to
#   bypass mouse reporting so host hints can fire (see [hints] above).
# - No Alt+Left/Right host chars: those keys are the vc-frame product contract
#   (tabs / LOCK word-jump). Diacritics stay Option+letter only.
# - No colors: vc-frame themes carry their own RGB. If you want the window
#   background to match the chrome ground, import a matching Alacritty theme
#   generated from your vc-frame theme (see docs/THEMES_GUIDE.md roadmap).
# - Ctrl+arrows remain optional LOCK bonus binds in vc-frame. Mission Control
#   may own them on macOS; the declared product contract is Alt+arrows, so
#   operators may leave Mission Control defaults alone.

